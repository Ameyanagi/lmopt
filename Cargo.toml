[package]
name = "lmopt"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
authors = ["LMOpt Contributors"]
description = "Levenberg-Marquardt optimization with the faer linear algebra library"
license = "MIT"
repository = "https://github.com/Ameyanagi/lmopt"
readme = "README.md"
keywords = ["optimization", "levenberg-marquardt", "numeric", "fitting", "least-squares"]
categories = ["algorithms", "mathematics", "science"]
exclude = ["tests/consumer"]
[dependencies]
# Linear algebra
faer = { version = "0.22.6", default-features = false, features = ["std", "rayon", "linalg"] }
faer-traits = "0.22.1"

# Interoperability
ndarray = { version = "0.16.1", optional = true }
nalgebra = { version = "0.33.2", optional = true }
num-traits = "0.2.18"

# Error handling
thiserror = "2.0.12"

[features]
default = []
ndarray = ["dep:ndarray"]
nalgebra = ["dep:nalgebra"]

[dev-dependencies]
anyhow = "1.0.100"
approx = "0.5.1"
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[lib]
name = "lmopt"
path = "src/lib.rs"

[[bench]]
name = "performance"
harness = false

[package.metadata.docs.rs]
all-features = true
